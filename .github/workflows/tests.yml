name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is in the matrix deliberately: a Windows build is the plan, and
    # this is what will surface the platform differences (symlink privileges,
    # path separators) before anyone tries to package an exe.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: The CLI at least starts
        run: python addons.py --help
