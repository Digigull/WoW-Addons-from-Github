name: release

# Deliberately separate from tests.yml, and deliberately not on every push: a
# slow build on every commit is how people stop watching CI. It runs on a tag,
# on demand, and on changes to the things that can break the builds themselves.
#
# The `tag` input is how a release is cut or repaired without touching git.
# Actions -> release -> Run workflow, leave the branch on main, type the tag.
#
#   the tag already exists   leave build_from blank; the builds check that tag
#                            out and publish edits its existing release in place
#   the tag is new           set build_from to main; the builds use that commit
#                            and publish creates the tag there
#
# Both matter to somebody working only in a browser. Rebuilding is how a release
# whose build failed on a bug since fixed gets republished without moving the
# tag, which the web UI cannot do -- and it works because the workflow that RUNS
# always comes from the ref you dispatch from, not from the tag. Creating is how
# a release happens at all without a git checkout to make the tag with.
#
# Blank tag builds both binaries and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "wowaddons/**"
      - "addons.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.5.0 (blank = build only, publish nothing)"
        required: false
        default: ""
      build_from:
        description: "Branch or commit to build, if the tag does not exist yet — usually: main"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_from || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # xvfb is for the smoke test, which opens a real window. It is not a
      # build dependency and nothing from it ends up in the AppImage.
      - name: Tools the smoke test needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Build
        run: packaging/appimage/build.sh

      # This is the step that matters. It proves Tk works inside the image
      # rather than assuming the base ships it -- see the script for why that
      # is worth a whole job's worth of care.
      - name: Smoke test
        run: packaging/appimage/smoke-test.sh dist/WoW-Addons-from-GitHub-x86_64.AppImage

      - name: What went in it
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/WoW-Addons-from-GitHub-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_from || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python packaging/windows/build.py

      # The .exe is built --windowed, so it has no console and no stdout until
      # it makes one. The smoke test runs every command through a pipe, which
      # is the case that must NOT grab a console: get it wrong and
      # `app.exe list > out.txt` leaves the file empty.
      - name: Smoke test
        run: python packaging/windows/smoke-test.py "dist/WoW Addons from GitHub"

      - name: What went in it
        run: Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/WoW-Addons-from-GitHub-windows-x64.zip
          if-no-files-found: error

  version-matches-tag:
    # A tag that ships a binary calling itself something else is how you end up
    # unable to reproduce a bug report. Cheap to check, and better here than
    # after both builds have spent five minutes.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_from || inputs.tag }}
      - name: The tag and wowaddons.__version__ must agree
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          declared=$(python3 -c "import wowaddons; print(wowaddons.__version__)")
          tagged="${RELEASE_TAG#v}"
          echo "tag says $tagged, code says $declared"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag ${RELEASE_TAG} ships a build calling itself $declared"
            exit 1
          fi

  publish:
    # One job creates the release, after both builds have proved themselves.
    # Attaching from each build job instead would race: two jobs would find no
    # release and both try to create it, and one of them would lose.
    needs: [appimage, windows, version-matches-tag]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # First, and not optional: the notes this job publishes live in the
      # repository, and a job that only downloads artifacts has an empty
      # workspace. This job went without a checkout until v0.3.1 failed on
      # `open .github/release-notes.md: no such file or directory` -- hidden
      # until then only because the old `view || create` shape skipped the
      # branch that read the file. It also has to come before the download:
      # checkout cleans the workspace, artifacts and all.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_from || inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist && sha256sum * | tee SHA256SUMS.txt

      # `gh` is already on the runner, so the release needs no third-party
      # action -- which suits a project whose selling point is a small trust
      # surface.
      # The title, the notes and the pre-release flag are applied whether or not
      # a release already exists for this tag -- and it usually WILL already
      # exist, because "Draft a new release" in the web UI is how most people
      # create the tag in the first place, and that publishes a release the
      # moment the tag appears.
      #
      # This step used to be `gh release view || gh release create`. That reads
      # as harmless idempotency and is not: when the release was pre-created,
      # `view` succeeded, `create` was skipped, and the flag and the notes went
      # with it. v0.3.0 published that way -- assets correct, but untitled, with
      # no notes, and not marked a pre-release. The assets were the easy part.
      #
      # --prerelease, deliberately. Both downloads are verified by CI on every
      # build, but neither has been run on real hardware against an actual WoW
      # install. GitHub's "Pre-release" label says exactly that, and it is one
      # click to promote once somebody has. Drop the flag here when that is
      # true -- and note that re-running this workflow re-asserts it, so a
      # release promoted by hand would be demoted again.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The commit to tag, read from the checkout rather than from a
          # context: github.sha is the DISPATCH ref's head, which is not the
          # same thing as build_from when the two name different branches.
          # Asking the working tree cannot drift from what was built.
          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "publishing ${RELEASE_TAG} at ${RELEASE_COMMIT}"

          # GitHub renders its own Assets block at the foot of the page, and
          # nothing in the notes can move it or open it. So the notes carry
          # their own download table at the very top, with direct links -- and
          # those links need the tag, which a file checked into the repository
          # cannot know. Substituted here, into a copy: every release then
          # links to its OWN assets rather than to whatever is newest.
          #
          # `/releases/latest/download/...` would need no substitution and is
          # wrong here: every release this workflow publishes is flagged as a
          # pre-release, and `latest` skips pre-releases, so those links would
          # 404 for as long as that is true.
          sed "s|__TAG__|${RELEASE_TAG}|g" .github/release-notes.md > notes.md
          if grep -q "__TAG__" notes.md; then
            echo "::error::the download links in release-notes.md were not substituted"
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release already exists; applying title, notes and pre-release flag"
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --prerelease \
              --notes-file notes.md
          else
            # --target names the commit to tag. Without it gh tags the
            # repository's default branch as it is at that moment, which is not
            # necessarily what these binaries were just built from.
            gh release create "${RELEASE_TAG}" \
              --target "${RELEASE_COMMIT}" \
              --title "${RELEASE_TAG}" \
              --prerelease \
              --notes-file notes.md
          fi
          gh release upload "${RELEASE_TAG}" dist/* --clobber

          # Prove it, rather than trusting the exit codes above. A release with
          # the right files and none of the right metadata is exactly the
          # failure this step just had, and it exited 0 at the time.
          gh release view "${RELEASE_TAG}" --json name,isPrerelease,body \
            --jq '"title=\(.name) prerelease=\(.isPrerelease) notes=\(.body|length) chars"'
          published=$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)
          notes=$(gh release view "${RELEASE_TAG}" --json body --jq '.body|length')
          if [ "$published" != "true" ] || [ "$notes" -lt 100 ]; then
            echo "::error::the release published without its metadata"
            exit 1
          fi
